<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSEB Paper Engine - Verification System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;700;800&display=swap');
        body { font-family: 'Mukta Malar', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        
        .view-pane { display: none; opacity: 0; }
        .view-pane.active { display: block; opacity: 1; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .paper-a4 {
            background: white; width: 210mm; min-height: 297mm; padding: 18mm;
            margin: 20px auto; border: 1px solid #cbd5e1; color: black;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative;
        }

        .topic-card { border: 2px solid #e2e8f0; transition: all 0.2s; cursor: pointer; }
        .topic-card.selected { border-color: #2563eb; background-color: #eff6ff; }
        
        .pulse-green { animation: pulseG 1.5s infinite; }
        @keyframes pulseG { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        @media print { 
            .no-print { display: none !important; } 
            .paper-a4 { margin: 0; border: none; width: 100%; padding: 0; } 
        }
    </style>
</head>
<body class="antialiased">

    <!-- Header -->
    <header class="no-print bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-file-invoice text-blue-500 text-2xl"></i>
                <h1 class="font-black text-lg uppercase tracking-tight">PSEB ਪੇਪਰ ਜਨਰੇਟਰ</h1>
            </div>
            <div id="status-badge" class="hidden bg-green-500 text-white text-[10px] px-2 py-1 rounded font-bold uppercase animate-pulse">ਸਿਸਟਮ ਐਕਟਿਵ</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 py-8">

        <!-- ਸਟੈਪ 1: ਸਕੂਲ ਅਤੇ ਜਮਾਤ -->
        <div id="pane-1" class="view-pane active bg-white p-6 rounded-3xl shadow-xl">
            <h2 class="text-xl font-black mb-6 text-slate-800 border-b pb-4">ਸਕੂਲ ਅਤੇ ਜਮਾਤ ਦੀ ਜਾਣਕਾਰੀ</h2>
            
            <div class="mb-6">
                <label class="block text-xs font-black text-slate-400 mb-2 uppercase">ਸਕੂਲ ਦਾ ਨਾਮ</label>
                <input type="text" id="schoolName" placeholder="ਸਰਕਾਰੀ ਪ੍ਰਾਇਮਰੀ ਸਕੂਲ..." class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold focus:border-blue-500 outline-none transition-all">
            </div>

            <label class="block text-xs font-black text-slate-400 mb-3 uppercase">ਜਮਾਤ ਚੁਣੋ</label>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3" id="class-grid"></div>
        </div>

        <!-- ਸਟੈਪ 2: ਵਿਸ਼ਾ ਅਤੇ ਤਤਕਰਾ -->
        <div id="pane-2" class="view-pane bg-white p-6 rounded-3xl shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="display-class" class="text-xl font-black text-slate-800">ਜਮਾਤ</h3>
                <button onclick="switchView(1)" class="text-xs font-bold bg-slate-100 px-3 py-2 rounded-lg hover:bg-slate-200">ਵਾਪਸ</button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 uppercase">ਵਿਸ਼ਾ (Subject)</label>
                    <select id="subjectSelect" onchange="loadCheckboxes()" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black outline-none focus:border-blue-500 transition-all">
                        <option value="">-- ਵਿਸ਼ਾ ਚੁਣੋ --</option>
                    </select>
                </div>
                
                <div id="checkbox-section" class="hidden">
                    <label class="block text-xs font-black text-slate-400 mb-3 uppercase">ਪਾਠ ਚੁਣੋ (ਤਤਕਰਾ)</label>
                    <div id="topics-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6 p-1"></div>
                    <button onclick="verifyAndConfirm()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-black hover:bg-black transition-all flex items-center justify-center gap-2">
                        ਡਾਟਾ ਚੈੱਕ ਕਰੋ ਅਤੇ ਪੁਸ਼ਟੀ ਕਰੋ <i class="fa-solid fa-magnifying-glass-chart"></i>
                    </button>
                </div>

                <!-- ਵੈਰੀਫਿਕੇਸ਼ਨ ਸਟੇਟਸ (New Feature) -->
                <div id="confirmation-section" class="hidden space-y-6">
                    <div class="bg-slate-900 text-white p-6 rounded-3xl relative overflow-hidden">
                        <div class="flex items-center gap-2 mb-4 text-green-400">
                            <i class="fa-solid fa-circle-check"></i>
                            <span class="text-xs font-black uppercase tracking-widest">ਫਾਈਲ ਵੈਰੀਫਿਕੇਸ਼ਨ ਰਿਪੋਰਟ</span>
                        </div>
                        <div id="confirmed-files-list" class="space-y-3">
                            <!-- Files with Verification Status -->
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white border-2 border-slate-100 p-4 rounded-2xl">
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">ਕੁੱਲ ਅੰਕ</label>
                            <input type="number" id="totalMarks" value="80" class="w-full font-black text-xl outline-none">
                        </div>
                        <div class="bg-white border-2 border-slate-100 p-4 rounded-2xl">
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">ਸਮਾਂ</label>
                            <input type="text" id="examTime" value="3 ਘੰਟੇ" class="w-full font-black text-xl outline-none">
                        </div>
                    </div>

                    <button onclick="triggerAIGeneration()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black text-xl shadow-lg hover:bg-blue-700 transition-all flex items-center justify-center gap-3">
                        ਪੇਪਰ ਜਨਰੇਟ ਕਰੋ <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ਸਟੈਪ 3: ਲੋਡਿੰਗ -->
        <div id="pane-3" class="view-pane text-center py-20 bg-white rounded-3xl shadow-xl">
            <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
            <h3 class="text-2xl font-black text-slate-800">ਸਿਸਟਮ ਡਾਟਾ ਪੜ੍ਹ ਰਿਹਾ ਹੈ...</h3>
            <p class="text-slate-400 text-sm mt-2" id="loading-text">ਕਿਰਪਾ ਕਰਕੇ ਇੰਤਜ਼ਾਰ ਕਰੋ</p>
        </div>

        <!-- ਸਟੈਪ 4: ਆਊਟਪੁੱਟ -->
        <div id="pane-4" class="view-pane">
            <div class="no-print flex gap-3 mb-6">
                <button onclick="location.reload()" class="bg-white border p-4 rounded-xl font-bold flex-1">ਨਵਾਂ ਪੇਪਰ</button>
                <button onclick="window.print()" class="bg-blue-600 text-white p-4 rounded-xl font-bold flex-1 shadow-lg"><i class="fa-solid fa-print"></i> ਪ੍ਰਿੰਟ</button>
            </div>
            <div id="final-paper-container"></div>
        </div>
    </main>

    <script>
        const apiKey = ""; 
        let currentClassData = null;
        let currentSubjectData = null;
        let selectedTopicIndices = [];

        const mainIndex = {
            "5": { 
                name: "ਪੰਜਵੀਂ", 
                code: "5", 
                subs: [
                    { id: "P", name: "ਪੰਜਾਬੀ", topics: ["ਮੇਰਾ ਹਿੰਦੁਸਤਾਨ", "ਗਤਕਾ", "ਸ਼ਹੀਦ ਊਧਮ ਸਿੰਘ", "ਸੁੰਦਰ ਲਿਖਾਈ", "ਬੀਰਬਲ ਦੀ ਖਿਚੜੀ", "ਹਵਾ", "ਸਾਂਝੀ ਮਾਂ"] },
                    { id: "E", name: "ਵਾਤਾਵਰਣ ਸਿੱਖਿਆ", topics: ["ਪਰਿਵਾਰ", "ਖੇਡਾਂ", "ਭੋਜਨ"] }
                ] 
            },
            "4": { name: "ਚੌਥੀ", code: "4", subs: [{id: "P", name: "ਪੰਜਾਬੀ", topics: ["ਪਾਠ 1", "ਪਾਠ 2"]}] }
        };

        window.onload = () => {
            const grid = document.getElementById('class-grid');
            Object.keys(mainIndex).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "p-4 bg-white border-2 border-slate-100 rounded-xl font-black text-slate-600 hover:border-blue-500 transition-all";
                btn.innerText = mainIndex[key].name;
                btn.onclick = () => {
                    if(!document.getElementById('schoolName').value) return alert("ਪਹਿਲਾਂ ਸਕੂਲ ਦਾ ਨਾਮ ਭਰੋ");
                    currentClassData = mainIndex[key];
                    document.getElementById('display-class').innerText = currentClassData.name + " ਜਮਾਤ";
                    const subSelect = document.getElementById('subjectSelect');
                    subSelect.innerHTML = '<option value="">-- ਵਿਸ਼ਾ ਚੁਣੋ --</option>' + currentClassData.subs.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                    switchView(2);
                };
                grid.appendChild(btn);
            });
        };

        function loadCheckboxes() {
            const subId = document.getElementById('subjectSelect').value;
            if(!subId) return;
            currentSubjectData = currentClassData.subs.find(s => s.id === subId);
            document.getElementById('topics-grid').innerHTML = currentSubjectData.topics.map((t, i) => `
                <div class="topic-card p-4 rounded-xl flex items-center gap-3" onclick="toggleTopic(this, ${i+1})">
                    <input type="checkbox" id="chk-${i+1}" class="w-5 h-5">
                    <span class="font-bold">${t}</span>
                </div>
            `).join('');
            document.getElementById('checkbox-section').classList.remove('hidden');
            document.getElementById('confirmation-section').classList.add('hidden');
        }

        function toggleTopic(el, idx) {
            const chk = el.querySelector('input');
            chk.checked = !chk.checked;
            el.classList.toggle('selected', chk.checked);
            if(chk.checked) selectedTopicIndices.push(idx);
            else selectedTopicIndices = selectedTopicIndices.filter(i => i !== idx);
        }

        // NEW: ਵੈਰੀਫਿਕੇਸ਼ਨ ਫੰਕਸ਼ਨ
        async function verifyAndConfirm() {
            if(selectedTopicIndices.length === 0) return alert("ਪਾਠ ਚੁਣੋ");
            
            const list = document.getElementById('confirmed-files-list');
            list.innerHTML = `<p class="text-blue-400 text-xs animate-pulse">ਸਿਸਟਮ ਫਾਈਲਾਂ ਦੀ ਮੌਜੂਦਗੀ ਚੈੱਕ ਕਰ ਰਿਹਾ ਹੈ...</p>`;
            
            document.getElementById('checkbox-section').classList.add('hidden');
            document.getElementById('confirmation-section').classList.remove('hidden');

            // Simulate file checking animation
            setTimeout(() => {
                list.innerHTML = selectedTopicIndices.map(idx => {
                    const topic = currentSubjectData.topics[idx-1];
                    const file = `${currentClassData.code}${currentSubjectData.id}${idx}.html`;
                    return `
                        <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <div>
                                <div class="text-[10px] text-slate-500 font-mono">${file}</div>
                                <div class="font-bold text-sm">${topic}</div>
                            </div>
                            <div class="flex items-center gap-2 text-[10px] font-black text-green-400 bg-green-500/10 px-2 py-1 rounded">
                                <i class="fa-solid fa-check-double"></i> READY TO READ
                            </div>
                        </div>
                    `;
                }).join('');
            }, 800);
        }

        async function triggerAIGeneration() {
            switchView(3);
            const school = document.getElementById('schoolName').value;
            const marks = document.getElementById('totalMarks').value;
            const time = document.getElementById('examTime').value;
            const files = selectedTopicIndices.map(idx => `${currentClassData.code}${currentSubjectData.id}${idx}.html`);
            const topics = selectedTopicIndices.map(idx => currentSubjectData.topics[idx-1]);

            const prompt = `
            Fetch data from: ${files.join(', ')}.
            Generate Paper for Class: ${currentClassData.name}, Subject: ${currentSubjectData.name}.
            School: ${school}, Marks: ${marks}, Time: ${time}.
            
            MANDATORY: 
            First, create a <div class="no-print" style="background:#e8f5e9; border:2px solid #2e7d32; padding:15px; border-radius:10px; margin-bottom:20px;">
                <h4 style="margin:0; color:#1b5e20;">✅ ਸਿਸਟਮ ਵੈਰੀਫਿਕੇਸ਼ਨ ਰਿਪੋਰਟ</h4>
                <p style="font-size:12px; margin:5px 0;">ਫਾਈਲ <b>${files.join(', ')}</b> ਸਫ਼ਲਤਾਪੂਰਵਕ ਪੜ੍ਹੀ ਗਈ। ਇਸ ਵਿੱਚ ਹੇਠ ਲਿਖੇ ਭਾਗ ਮਿਲੇ ਹਨ:</p>
                <ul style="font-size:12px; font-weight:bold;">[List categories like MCQ, Fill ups, Match column, Word Meanings, etc.]</ul>
            </div>
            Then, generate the full question paper in Punjabi.
            `;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                const content = data.candidates[0].content.parts[0].text.replace(/```html|```/g, '');
                
                document.getElementById('final-paper-container').innerHTML = `
                    <div class="paper-a4">
                        <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:20px;">
                            <h2 style="margin:0; font-size:24px;">${school}</h2>
                            <p style="margin:5px 0; font-weight:bold;">ਜਮਾਤ: ${currentClassData.name} | ਵਿਸ਼ਾ: ${currentSubjectData.name}</p>
                            <p style="margin:0; font-size:14px;">ਸਮਾਂ: ${time} | ਕੁੱਲ ਅੰਕ: ${marks}</p>
                        </div>
                        ${content}
                    </div>
                `;
                switchView(4);
            } catch (e) {
                alert("Error generating paper");
                switchView(2);
            }
        }

        function switchView(n) {
            document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));
            document.getElementById('pane-'+n).classList.add('active');
        }
    </script>
</body>
</html>
