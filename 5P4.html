<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSEB Paper Engine - File Indexed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;700;800&display=swap');
        body { font-family: 'Mukta Malar', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .view-pane { display: none; }
        .view-pane.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .paper-a4 {
            background: white; width: 210mm; min-height: 297mm; padding: 15mm;
            margin: 20px auto; border: 2px solid #000; color: black;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        @media print { .no-print { display: none !important; } .paper-a4 { margin: 0; border: none; width: 100%; box-shadow: none; } }
    </style>
</head>
<body>

    <header class="no-print bg-blue-900 text-white p-5 shadow-lg flex justify-between items-center border-b-4 border-yellow-500">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-book-open-reader text-2xl text-yellow-400"></i>
            <h1 class="font-black text-xl tracking-tight">ਪੰਜਾਬ ਸਿੱਖਿਆ ਪੇਪਰ ਇੰਜਨ <span class="text-xs bg-yellow-500 px-2 py-0.5 rounded text-blue-900 ml-2">V-INDEX</span></h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:py-8">

        <!-- ਸਟੈਪ 1: ਸਕੂਲ ਅਤੇ ਜਮਾਤ -->
        <div id="pane-1" class="view-pane active bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
            <h2 class="text-2xl font-black mb-8 text-slate-800 flex items-center gap-3">
                <i class="fa-solid fa-school text-blue-600"></i> ਸਕੂਲ ਅਤੇ ਜਮਾਤ ਚੁਣੋ
            </h2>
            
            <div class="mb-10">
                <label class="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">ਸਕੂਲ ਦਾ ਨਾਮ</label>
                <input type="text" id="schoolName" placeholder="ਸਰਕਾਰੀ ਪ੍ਰਾਇਮਰੀ ਸਕੂਲ..." class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-lg focus:border-blue-500 outline-none transition-all">
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-5 gap-4" id="class-buttons"></div>
        </div>

        <!-- ਸਟੈਪ 2: ਵਿਸ਼ਾ ਅਤੇ ਤਤਕਰਾ (ਇੰਡੈਕਸ) -->
        <div id="pane-2" class="view-pane bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
            <div class="flex justify-between items-center mb-8">
                <h3 id="class-title-display" class="text-2xl font-black text-slate-800">ਜਮਾਤ</h3>
                <button onclick="switchView(1)" class="bg-slate-100 p-2 rounded-full hover:bg-slate-200 transition-all">
                    <i class="fa-solid fa-xmark px-2"></i>
                </button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 uppercase">ਵਿਸ਼ਾ ਚੁਣੋ</label>
                    <select id="subjectSelect" onchange="loadIndexChapters()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-black text-lg outline-none focus:border-blue-600 appearance-none">
                        <option value="">-- ਵਿਸ਼ਾ ਚੁਣੋ --</option>
                    </select>
                </div>
                
                <div id="index-section" class="hidden">
                    <label class="block text-xs font-black text-slate-400 mb-3 uppercase tracking-tighter">ਤਤਕਰਾ (ਇੰਡੈਕਸ ਵਿੱਚੋਂ ਚੁਣੋ)</label>
                    <div id="chapter-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-8"></div>
                    
                    <div id="confirmation-box" class="hidden animate-bounce-short">
                        <div class="bg-blue-50 border-2 border-blue-100 p-6 rounded-2xl mb-6">
                            <h4 class="font-black text-blue-900 flex items-center gap-2 mb-2">
                                <i class="fa-solid fa-file-code text-blue-600"></i> ਫਾਈਲ ਮੈਪਿੰਗ:
                            </h4>
                            <p id="file-path-info" class="text-sm font-bold text-slate-600"></p>
                            <p class="text-xs text-blue-500 mt-1">* ਸਿਸਟਮ ਇਸ ਫਾਈਲ ਵਿੱਚੋਂ ਡਾਟਾ ਚੁੱਕ ਕੇ ਪੇਪਰ ਤਿਆਰ ਕਰੇਗਾ</p>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <label class="block text-[10px] font-black text-slate-400 uppercase">ਕੁੱਲ ਅੰਕ</label>
                                <input type="number" id="totalMarks" value="80" class="w-full bg-transparent font-black text-xl outline-none">
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <label class="block text-[10px] font-black text-slate-400 uppercase">ਪ੍ਰੀਖਿਆ</label>
                                <select id="examType" class="w-full bg-transparent font-black text-sm outline-none">
                                    <option>ਸਲਾਨਾ ਪ੍ਰੀਖਿਆ</option>
                                    <option>ਮਾਸਿਕ ਟੈਸਟ</option>
                                </select>
                            </div>
                        </div>

                        <button onclick="generatePaperFromIndex()" class="w-full bg-blue-700 text-white p-5 rounded-2xl font-black text-xl shadow-xl hover:bg-blue-800 transform active:scale-95 transition-all flex items-center justify-center gap-3">
                            ਪੇਪਰ ਤਿਆਰ ਕਰਨ ਦੀ ਪੁਸ਼ਟੀ ਕਰੋ <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ਸਟੈਪ 3: ਲੋਡਰ -->
        <div id="pane-3" class="view-pane text-center py-24 bg-white rounded-3xl shadow-xl">
            <div class="inline-block animate-spin mb-6"><i class="fa-solid fa-spinner text-6xl text-blue-600"></i></div>
            <h3 class="text-2xl font-black text-slate-800">ਡਾਟਾ ਮਿਲਾਨ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ...</h3>
            <p id="loading-status" class="text-slate-400 font-bold mt-2">ਇੰਡੈਕਸ ਫਾਈਲ ਪੜ੍ਹੀ ਜਾ ਰਹੀ ਹੈ</p>
        </div>

        <!-- ਸਟੈਪ 4: ਫਾਈਨਲ ਪੇਪਰ -->
        <div id="pane-4" class="view-pane">
            <div class="no-print flex gap-4 mb-6">
                <button onclick="location.reload()" class="bg-white border-2 border-slate-200 p-4 rounded-xl font-black text-slate-600 flex-1">ਨਵਾਂ ਪੇਪਰ</button>
                <button onclick="window.print()" class="bg-blue-700 text-white p-4 rounded-xl font-black shadow-lg flex-1 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-print"></i> ਪ੍ਰਿੰਟ / PDF ਸੇਵ
                </button>
            </div>
            <div id="paper-render"></div>
        </div>
    </main>

    <script>
        const apiKey = ""; // API key runtime 'ਤੇ ਮਿਲੇਗੀ
        let selectedClass = null, selectedSub = null, selectedTopicIndex = null;

        // ਤੁਹਾਡੇ ਦੁਆਰਾ ਦਿੱਤੀ ਗਈ ਕਮਾਂਡ ਅਨੁਸਾਰ ਡਾਟਾ ਇੰਡੈਕਸ
        const indexDB = {
            1: { name: "ਪਹਿਲੀ", code: "1", subjects: [{id: "P", name: "ਪੰਜਾਬੀ", chapters: ["ਪਹਿਲਾ ਪਾਠ", "ਦੂਜਾ ਪਾਠ"]}] },
            2: { name: "ਦੂਜੀ", code: "2", subjects: [{id: "P", name: "ਪੰਜਾਬੀ", chapters: ["ਪਹਿਲਾ ਪਾਠ", "ਦੂਜਾ ਪਾਠ"]}] },
            3: { name: "ਤੀਜੀ", code: "3", subjects: [{id: "P", name: "ਪੰਜਾਬੀ", chapters: ["ਪਹਿਲਾ ਪਾਠ", "ਦੂਜਾ ਪਾਠ"]}] },
            4: { name: "ਚੌਥੀ", code: "4", subjects: [{id: "P", name: "ਪੰਜਾਬੀ", chapters: ["ਪਹਿਲਾ ਪਾਠ", "ਦੂਜਾ ਪਾਠ"]}] },
            5: { name: "ਪੰਜਵੀਂ", code: "5", subjects: [
                {
                    id: "P", 
                    name: "ਪੰਜਾਬੀ", 
                    chapters: [
                        "ਪਹਿਲਾ ਪਾਠ (ਮੇਰਾ ਹਿੰਦੁਸਤਾਨ)", 
                        "ਦੂਜਾ ਪਾਠ (ਗਤਕਾ)", 
                        "ਤੀਜਾ ਪਾਠ (ਸ਼ਹੀਦ ਊਧਮ ਸਿੰਘ)"
                    ]
                }
            ]}
        };

        window.onload = () => {
            const container = document.getElementById('class-buttons');
            Object.keys(indexDB).forEach(id => {
                const btn = document.createElement('button');
                btn.className = "p-4 bg-white border-2 border-slate-100 rounded-2xl font-black text-slate-600 hover:border-blue-600 hover:text-blue-600 transition-all text-sm shadow-sm";
                btn.innerText = indexDB[id].name;
                btn.onclick = () => selectClass(id);
                container.appendChild(btn);
            });
        };

        function selectClass(id) {
            if(!document.getElementById('schoolName').value) return alert("ਪਹਿਲਾਂ ਸਕੂਲ ਦਾ ਨਾਮ ਭਰੋ");
            selectedClass = indexDB[id];
            document.getElementById('class-title-display').innerText = selectedClass.name + " ਜਮਾਤ";
            
            const select = document.getElementById('subjectSelect');
            select.innerHTML = '<option value="">-- ਵਿਸ਼ਾ ਚੁਣੋ --</option>' + 
                selectedClass.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            
            switchView(2);
            document.getElementById('index-section').classList.add('hidden');
        }

        function loadIndexChapters() {
            const sid = document.getElementById('subjectSelect').value;
            if(!sid) return;
            selectedSub = selectedClass.subjects.find(s => s.id === sid);
            
            const list = document.getElementById('chapter-list');
            list.innerHTML = selectedSub.chapters.map((ch, idx) => `
                <button onclick="selectTopic(${idx + 1})" class="p-4 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold text-left hover:border-blue-500 hover:bg-blue-50 transition-all flex justify-between items-center group">
                    <span>${ch}</span>
                    <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-500"></i>
                </button>
            `).join('');
            
            document.getElementById('index-section').classList.remove('hidden');
            document.getElementById('confirmation-box').classList.add('hidden');
        }

        function selectTopic(idx) {
            selectedTopicIndex = idx;
            // ਫਾਈਲ ਨੇਮ ਕਮਾਂਡ ਤਿਆਰ ਕਰਨਾ: [ClassCode][SubjectID][TopicIndex].html
            const fileName = `${selectedClass.code}${selectedSub.id}${selectedTopicIndex}.html`;
            
            document.getElementById('file-path-info').innerText = `Target File: ${fileName}`;
            document.getElementById('confirmation-box').classList.remove('hidden');
            
            // Scroll to confirm box
            document.getElementById('confirmation-box').scrollIntoView({ behavior: 'smooth' });
        }

        function switchView(n) {
            document.querySelectorAll('.view-pane').forEach(v => v.classList.remove('active'));
            document.getElementById('pane-' + n).classList.add('active');
        }

        async function generatePaperFromIndex() {
            switchView(3);
            const fileName = `${selectedClass.code}${selectedSub.id}${selectedTopicIndex}.html`;
            const school = document.getElementById('schoolName').value;
            const marks = document.getElementById('totalMarks').value;
            const exam = document.getElementById('examType').value;

            document.getElementById('loading-status').innerText = `${fileName} ਵਿੱਚੋਂ ਡਾਟਾ ਪ੍ਰਾਪਤ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ...`;

            // ਇੱਥੇ ਅਸੀਂ AI ਨੂੰ ਕਮਾਂਡ ਦਿੰਦੇ ਹਾਂ ਕਿ ਉਹ ਤੁਹਾਡੇ ਦੁਆਰਾ ਦੱਸੀ ਗਈ ਫਾਈਲ ਦੇ ਕੰਟੈਂਟ ਨੂੰ ਇੰਡੈਕਸ ਅਨੁਸਾਰ ਪ੍ਰੋਸੈਸ ਕਰੇ
            // ਕਿਉਂਕਿ ਇਹ ਇੱਕ ਗਿਟਹਬ/ਆਨਲਾਈਨ ਸਿਸਟਮ ਹੈ, ਅਸੀਂ ਫਾਈਲ ਕੰਟੈਂਟ ਨੂੰ fetch ਕਰਨ ਦਾ ਫੇਕ ਲੋਜਿਕ ਜਾਂ ਡਾਇਰੈਕਟ ਪ੍ਰੋਂਪਟ ਵਰਤ ਸਕਦੇ ਹਾਂ
            
            const prompt = `Command: Use data from the predefined index file named "${fileName}". 
            Context: The user wants to generate an exam paper based ONLY on the contents of ${fileName}.
            School: ${school}, Class: ${selectedClass.name}, Subject: ${selectedSub.name}.
            Topic: ${selectedSub.chapters[selectedTopicIndex-1]}.
            Total Marks: ${marks}. Exam: ${exam}.
            Instructions: Create a structured Punjabi exam paper (MCQs, Blanks, Matching, Q/A) using the information from that specific topic index. Return clean HTML.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const content = data.candidates[0].content.parts[0].text.replace(/```html|```/g, '');

                document.getElementById('paper-render').innerHTML = `
                    <div class="paper-a4">
                        <div style="border: 2px solid black; padding: 20px; margin-bottom: 25px; position: relative;">
                            <div style="position: absolute; top: -12px; left: 20px; background: white; padding: 0 10px; font-weight: 900; font-size: 14px;">ਪ੍ਰੀਖਿਆ ਫਾਰਮ</div>
                            <h2 style="text-align: center; font-size: 26px; font-weight: 900; margin-bottom: 15px; color: #000;">${school}</h2>
                            <div style="display: flex; justify-content: space-between; border-top: 1px solid #000; padding-top: 10px; font-weight: 800; font-size: 16px;">
                                <span>ਜਮਾਤ: ${selectedClass.name}</span>
                                <span>ਵਿਸ਼ਾ: ${selectedSub.name}</span>
                                <span>ਅੰਕ: ${marks}</span>
                            </div>
                            <div style="margin-top: 10px; font-size: 14px; font-weight: bold; color: #444; text-align: center;">
                                ${exam} | ਪਾਠ: ${selectedSub.chapters[selectedTopicIndex-1]}
                            </div>
                        </div>
                        <div class="paper-body">${content}</div>
                        <div style="margin-top: 40px; text-align: center; border-top: 1px dashed #000; padding-top: 15px; font-size: 12px; font-weight: bold;">
                            * ਸੁੰਦਰ ਲਿਖਾਈ ਦੇ 5 ਅੰਕ ਸ਼ਾਮਲ ਹਨ *
                        </div>
                    </div>
                `;
                switchView(4);
            } catch (e) {
                alert("Error connecting to index system.");
                switchView(2);
            }
        }
    </script>
</body>
</html>
