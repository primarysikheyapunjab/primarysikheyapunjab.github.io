<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSEB Paper Engine V6.0 - Fixed Syllabus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;700;800&display=swap');
        body { font-family: 'Mukta Malar', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .view-pane { display: none; }
        .view-pane.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .paper-a4 {
            background: white; width: 210mm; min-height: 297mm; padding: 15mm;
            margin: 20px auto; border: 2px solid #000; color: black;
            box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative;
        }
        .bsm-header-container { border: 2px solid black; margin-bottom: 20px; }
        .header-top-row { display: flex; border-bottom: 2px solid black; }
        .header-class-info { flex: 1; padding: 10px; border-right: 2px solid black; text-align: center; font-size: 20px; font-weight: 800; }
        .bsm-box { width: 120px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: 900; }
        .student-fields { padding: 12px; font-size: 16px; font-weight: 600; }
        .field-row { display: flex; margin-bottom: 10px; align-items: flex-end; }
        .dotted-line { flex: 1; border-bottom: 2px dotted black; margin-left: 8px; margin-bottom: 3px; }
        .header-footer { display: flex; border-top: 2px solid black; padding: 6px 12px; justify-content: space-between; font-weight: 800; font-size: 15px; }

        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media print { .no-print { display: none !important; } .paper-a4 { margin: 0; border: none; width: 100%; box-shadow: none; } }
    </style>
</head>
<body>

    <header class="no-print bg-blue-700 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-white p-1.5 rounded-lg">
                <i class="fa-solid fa-graduation-cap text-blue-700 text-xl"></i>
            </div>
            <h1 class="font-black text-lg tracking-tight">ਪ੍ਰਾਇਮਰੀ ਸਿੱਖਿਆ ਪੰਜਾਬ <span class="text-blue-200 font-normal ml-2 text-sm">V6.0 ਸਰਕਾਰੀ ਸਿਲੇਬਸ</span></h1>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 md:pt-6">

        <!-- STEP 1: Basic Info & Class Selection -->
        <div id="pane-1" class="view-pane active bg-white p-6 md:p-10 rounded-3xl shadow-xl border border-blue-50">
            <h2 class="text-2xl font-black mb-8 flex items-center gap-3 text-blue-900">
                <i class="fa-solid fa-school text-blue-500"></i> ਪੇਪਰ ਦੀ ਜਾਣਕਾਰੀ
            </h2>
            
            <div class="mb-8">
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">ਸਕੂਲ ਦਾ ਨਾਮ</label>
                <input type="text" id="schoolName" placeholder="ਸਰਕਾਰੀ ਪ੍ਰਾਇਮਰੀ ਸਕੂਲ..." class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-lg focus:border-blue-500 focus:bg-white outline-none transition-all">
            </div>

            <p class="text-center font-black text-slate-300 text-xs mb-4 uppercase tracking-[0.2em]">ਜਮਾਤ ਦੀ ਚੋਣ ਕਰੋ</p>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3" id="class-buttons"></div>
        </div>

        <!-- STEP 2: Subject & Auto Chapter List -->
        <div id="pane-2" class="view-pane bg-white p-6 md:p-10 rounded-3xl shadow-xl border border-blue-50">
            <div class="flex justify-between items-center mb-8">
                <h3 id="class-title-display" class="text-2xl font-black text-blue-900">ਵਿਸ਼ਾ ਚੁਣੋ</h3>
                <button onclick="switchView(1)" class="text-slate-400 font-bold hover:text-blue-600">ਪਿੱਛੇ</button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">ਵਿਸ਼ਾ ਚੁਣੋ</label>
                    <select id="subjectSelect" onchange="loadChapters()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-lg outline-none focus:border-blue-500">
                        <option value="">-- ਵਿਸ਼ਾ ਚੁਣੋ --</option>
                    </select>
                </div>
                
                <div id="chapter-section" class="hidden">
                    <label class="block text-sm font-bold text-slate-400 mb-3 uppercase">ਪਾਠ ਚੁਣੋ (ਤਤਕਰਾ)</label>
                    <div id="chapter-list" class="space-y-2 max-h-60 overflow-y-auto pr-2 mb-6 border-b border-slate-100 pb-4"></div>
                    
                    <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">ਕਿਤਾਬ ਦੀ PDF ਅਪਲੋਡ ਕਰੋ</label>
                    <div class="border-2 border-dashed border-blue-200 rounded-2xl p-6 text-center hover:bg-blue-50 cursor-pointer transition-all" onclick="document.getElementById('pdfInput').click()">
                        <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="handleFileUpload(event)">
                        <i class="fa-solid fa-file-pdf text-3xl text-blue-400 mb-2"></i>
                        <p id="file-status" class="font-bold text-slate-600">ਕਿਤਾਬ ਚੁਣੋ</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mt-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">ਕੁੱਲ ਅੰਕ</label>
                            <input type="number" id="totalMarks" value="80" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl font-black text-center">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">ਪ੍ਰੀਖਿਆ</label>
                            <select id="examType" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold">
                                <option>ਸਲਾਨਾ ਪ੍ਰੀਖਿਆ</option>
                                <option>ਮਾਸਿਕ ਟੈਸਟ</option>
                                <option>ਟਰਮ ਪ੍ਰੀਖਿਆ</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="startPaperGeneration()" id="gen-btn" class="hidden w-full mt-8 bg-blue-700 text-white p-5 rounded-2xl font-black text-xl shadow-lg hover:bg-blue-800 transition-all">
                        ਪ੍ਰਸ਼ਨ ਪੱਤਰ ਤਿਆਰ ਕਰੋ <i class="fa-solid fa-wand-magic-sparkles ml-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- STEP 3: Loader -->
        <div id="pane-3" class="view-pane text-center py-20 bg-white rounded-3xl shadow-xl">
            <div class="flex flex-col items-center">
                <div class="spinner mb-6"></div>
                <h3 class="text-xl font-black text-slate-800">AI ਪੇਪਰ ਤਿਆਰ ਕਰ ਰਿਹਾ ਹੈ...</h3>
                <p class="text-slate-400 text-sm mt-2">ਤੁਹਾਡੇ ਚੁਣੇ ਹੋਏ ਪਾਠਾਂ ਮੁਤਾਬਕ ਪ੍ਰਸ਼ਨ ਲਿਖੇ ਜਾ ਰਹੇ ਹਨ</p>
            </div>
        </div>

        <!-- STEP 4: Final Preview -->
        <div id="pane-4" class="view-pane">
            <div class="no-print flex gap-3 mb-6">
                <button onclick="switchView(1)" class="flex-1 bg-white border-2 border-slate-200 p-4 rounded-2xl font-black text-slate-600">ਨਵਾਂ ਪੇਪਰ</button>
                <button onclick="window.print()" class="flex-[2] bg-blue-700 text-white p-4 rounded-2xl font-black shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-print"></i> ਪ੍ਰਿੰਟ / ਸੇਵ ਕਰੋ
                </button>
            </div>
            <div id="final-paper-output"></div>
        </div>
    </main>

    <script>
        const apiKey = "";
        let selectedFileBase64 = null;
        let selectedClassId = null;
        let selectedSubject = null;

        // ਤੁਹਾਡੇ ਵੱਲੋਂ ਦਿੱਤਾ ਗਿਆ ਮੁਕੰਮਲ ਡਾਟਾਬੇਸ
        const schoolData = {
            1: { name: "ਪਹਿਲੀ ਜਮਾਤ", subjects: [
                { id: "p", name: "ਪੰਜਾਬੀ", chapters: ["ਪੰਜਾਬੀ ਵਰਣਮਾਲਾ (ੳ-ੜ)", "ਮੁਕਤਾ ਸ਼ਬਦ", "ਕੰਨਾ (ਾ) ਮਾਤਰਾ", "ਸਿਹਾਰੀ (ਿ) ਮਾਤਰਾ", "ਬਿਹਾਰੀ (ੀ) ਮਾਤਰਾ", "ਔਂਕੜ (ੁ) ਮਾਤਰਾ", "ਦੁਲੈਂਕੜ (ੂ) ਮਾਤਰਾ", "ਲਾਂ (ੇ) ਮਾਤਰਾ", "ਦੁਲਾਵਾਂ (ੈ) ਮਾਤਰਾ", "ਹੋੜਾ (ੋ) ਮਾਤਰਾ", "ਕਨੌੜਾ (ੌ) ਮਾਤਰਾ", "ਲਗਾਖਰ (ਬਿੰਦੀ, ਟਿੱਪੀ, ਅੱਧਕ)"] },
                { id: "m", name: "ਗਣਿਤ", chapters: ["ਆਕਾਰ ਅਤੇ ਸਥਾਨ", "ਸੰਖਿਆਵਾਂ 1 ਤੋਂ 9", "ਜੋੜ (1-9)", "ਘਟਾਓ (1-9)", "ਸੰਖਿਆਵਾਂ 10 ਤੋਂ 20", "ਸਮਾਂ", "ਮਾਪ (ਲੰਬਾਈ/ਭਾਰ)", "ਸੰਖਿਆਵਾਂ 21 ਤੋਂ 99"] },
                { id: "e", name: "English", chapters: ["Alphabets (A-Z)", "Myself", "Parts of Body", "Colours", "Fruits & Veggies", "Animals"] }
            ]},
            2: { name: "ਦੂਜੀ ਜਮਾਤ", subjects: [
                { id: "p", name: "ਪੰਜਾਬੀ", chapters: ["ਸਾਡਾ ਤਿਰੰਗਾ", "ਚਿੜੀਆ ਘਰ", "ਮਾਤਾ ਗੁਜਰੀ ਜੀ", "ਸਿਆਣੀ ਗੱਲ", "ਮੇਰਾ ਪੰਜਾਬ", "ਸ਼ੇਰ ਅਤੇ ਚੂਹੀ", "ਬੁਝਾਰਤਾਂ"] },
                { id: "m", name: "ਗਣਿਤ", chapters: ["ਸੰਖਿਆਵਾਂ 1-99", "ਜੋੜ-ਘਟਾਓ", "ਗੁਣਾ (ਮੁੱਢਲੀ)", "ਭਾਗ (ਮੁੱਢਲੀ)", "ਪੈਸਾ (ਕਰੰਸੀ)", "ਸਮਾਂ ਅਤੇ ਕੈਲੰਡਰ"] },
                { id: "e", name: "English", chapters: ["Revision", "My Family", "Days of Week", "Months", "Opposites", "Action Words"] }
            ]},
            3: { name: "ਤੀਜੀ ਜਮਾਤ", subjects: [
                { id: "p", name: "ਪੰਜਾਬੀ", chapters: ["ਸਾਡਾ ਦੇਸ਼", "ਦਰੱਖਤ ਦੀ ਗਵਾਹੀ", "ਵੱਡਾ ਕੌਣ?", "ਸ਼ਹੀਦ ਊਧਮ ਸਿੰਘ", "ਬੱਦਲ", "ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ"] },
                { id: "m", name: "ਗਣਿਤ", chapters: ["ਸੰਖਿਆਵਾਂ (1000 ਤੱਕ)", "ਜੋੜ-ਘਟਾਓ", "ਗੁਣਾ", "ਭਾਗ", "ਭਿੰਨਾਂ (Fractions)", "ਅੰਕੜਾ ਵਿਗਿਆਨ"] },
                { id: "e", name: "English", chapters: ["Me and My Family", "The Clock", "The Magic Box", "Traffic Rules", "Festivals"] },
                { id: "ev", name: "ਵਾਤਾਵਰਨ", chapters: ["ਮੇਰਾ ਪਰਿਵਾਰ", "ਸਾਡੇ ਪੌਦੇ", "ਸਾਡਾ ਭੋਜਨ", "ਪਾਣੀ", "ਆਵਾਜਾਈ"] }
            ]},
            4: { name: "ਚੌਥੀ ਜਮਾਤ", subjects: [
                { id: "p", name: "ਪੰਜਾਬੀ", chapters: ["ਪ੍ਰਾਰਥਨਾ", "ਮਹਾਤਮਾ ਗਾਂਧੀ", "ਰੁੱਖਾਂ ਦੀ ਮਹੱਤਤਾ", "ਕੰਪਿਊਟਰ", "ਸਿਆਣਾ ਕਾਂ"] },
                { id: "m", name: "ਗਣਿਤ", chapters: ["ਸੰਖਿਆਵਾਂ", "ਕਿਰਿਆਵਾਂ", "ਮਾਪ", "ਆਕਾਰ ਅਤੇ ਕੋਣ", "ਭਿੰਨਾਂ"] },
                { id: "e", name: "English", chapters: ["The King & Sons", "Safety Rules", "Health is Wealth", "Pronouns"] },
                { id: "ev", name: "ਵਾਤਾਵਰਨ", chapters: ["ਖੇਡਾਂ ਅਤੇ ਸਿਹਤ", "ਆਵਾਸ", "ਪਾਣੀ ਦੀ ਸੰਭਾਲ", "ਧਰਤੀ ਅਤੇ ਆਕਾਸ਼"] },
                { id: "h", name: "हिंदी", chapters: ["वर्णमाला", "मात्राएँ", "तिरंगा", "अच्छी आदतें"] }
            ]},
            5: { name: "ਪੰਜਵੀਂ ਜਮਾਤ", subjects: [
                { id: "p", name: "ਪੰਜਾਬੀ", chapters: ["ਮੇਰਾ ਹਿੰਦੁਸਤਾਨ", "ਗਤਕਾ", "ਸ਼ਹੀਦ ਊਧਮ ਸਿੰਘ", "ਆਸਮਾਨ ਦੀਆਂ ਪਰੀਆਂ", "ਕਲਪਨਾ ਚਾਵਲਾ", "ਸ਼ਹੀਦ ਭਗਤ ਸਿੰਘ"] },
                { id: "m", name: "ਗਣਿਤ", chapters: ["ਸੰਖਿਆਵਾਂ", "HCF & LCM", "ਭਿੰਨਾਂ", "ਦਸ਼ਮਲਵ", "ਘੇਰਾ ਅਤੇ ਖੇਤਰਫਲ"] },
                { id: "e", name: "English", chapters: ["The Elves & Shoemaker", "The Flying Sikh", "Global Warming", "Safe Circle"] },
                { id: "ev", name: "ਵਾਤਾਵਰਨ", chapters: ["ਬਦਲਦੇ ਪਰਿਵਾਰ", "ਬੀਜ ਦਾ ਸਫ਼ਰ", "ਜੰਗਲ ਅਤੇ ਜੀਵਨ", "ਕੌਮੀ ਚਿੰਨ੍ਹ"] },
                { id: "h", name: "हिंदी", chapters: ["जय हिन्द", "सच्चा मित्र", "स्वच्छता", "समय का मोल"] }
            ]}
        };

        window.onload = () => {
            const grid = document.getElementById('class-buttons');
            Object.keys(schoolData).forEach(id => {
                const btn = document.createElement('button');
                btn.className = "p-4 rounded-xl border-2 border-slate-100 font-black text-slate-600 bg-white hover:border-blue-500 hover:text-blue-600 transition-all text-sm";
                btn.innerText = schoolData[id].name;
                btn.onclick = () => selectClass(id);
                grid.appendChild(btn);
            });
        };

        function selectClass(id) {
            if(!document.getElementById('schoolName').value) return alert("ਪਹਿਲਾਂ ਸਕੂਲ ਦਾ ਨਾਮ ਭਰੋ");
            selectedClassId = id;
            document.getElementById('class-title-display').innerText = schoolData[id].name;
            
            const select = document.getElementById('subjectSelect');
            select.innerHTML = '<option value="">-- ਵਿਸ਼ਾ ਚੁਣੋ --</option>';
            schoolData[id].subjects.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                opt.innerText = sub.name;
                select.appendChild(opt);
            });
            
            document.getElementById('chapter-section').classList.add('hidden');
            switchView(2);
        }

        function loadChapters() {
            const subId = document.getElementById('subjectSelect').value;
            if(!subId) {
                document.getElementById('chapter-section').classList.add('hidden');
                return;
            }
            
            selectedSubject = schoolData[selectedClassId].subjects.find(s => s.id === subId);
            const list = document.getElementById('chapter-list');
            list.innerHTML = selectedSubject.chapters.map(ch => `
                <label class="flex items-center gap-3 p-3 bg-slate-50 border border-slate-100 rounded-xl cursor-pointer hover:bg-blue-50">
                    <input type="checkbox" class="ch-cb w-5 h-5 accent-blue-600" value="${ch}" checked>
                    <span class="font-bold text-slate-700 text-sm">${ch}</span>
                </label>
            `).join('');
            
            document.getElementById('chapter-section').classList.remove('hidden');
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedFileBase64 = e.target.result.split(',')[1];
                    document.getElementById('file-status').innerText = "ਫਾਈਲ ਤਿਆਰ ਹੈ: " + file.name;
                    document.getElementById('gen-btn').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function switchView(n) {
            document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));
            document.getElementById(`pane-${n}`).classList.add('active');
            window.scrollTo(0,0);
        }

        async function startPaperGeneration() {
            const chapters = Array.from(document.querySelectorAll('.ch-cb:checked')).map(c => c.value);
            if(!chapters.length) return alert("ਕਿਰਪਾ ਕਰਕੇ ਘੱਟੋ-ਘੱਟ ਇੱਕ ਪਾਠ ਚੁਣੋ");
            
            switchView(3);
            
            const school = document.getElementById('schoolName').value;
            const marks = document.getElementById('totalMarks').value;
            const exam = document.getElementById('examType').value;
            const className = schoolData[selectedClassId].name;
            const subName = selectedSubject.name;

            const prompt = `Generate a PSEB Exam Paper for Class: ${className}, Subject: ${subName}. 
            Include questions from these chapters: ${chapters.join(', ')}.
            Format: Punjabi language. Sections: MCQs, True/False, Fill in blanks, and Q/A.
            Return only clean HTML code for the body content.`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "application/pdf", data: selectedFileBase64 } }] }]
                    })
                });

                const data = await res.json();
                let htmlContent = data.candidates[0].content.parts[0].text.replace(/```html|```/g, '');

                document.getElementById('final-paper-output').innerHTML = `
                    <div class="paper-a4">
                        <div class="bsm-header-container">
                            <div class="header-top-row">
                                <div class="header-class-info">
                                    <div>ਜਮਾਤ: ${className}</div>
                                    <div>ਵਿਸ਼ਾ: ${subName}</div>
                                </div>
                                <div class="bsm-box">PSP</div>
                            </div>
                            <div class="student-fields">
                                <div class="field-row">ਸਕੂਲ: <div class="dotted-line">${school}</div></div>
                                <div class="field-row">ਵਿਦਿਆਰਥੀ: <div class="dotted-line"></div></div>
                                <div class="field-row">
                                    <div style="flex:1; display:flex;">ਰੋਲ ਨੰ: <div class="dotted-line"></div></div>
                                    <div style="flex:1; display:flex; justify-content:flex-end;">ਮਿਤੀ: <div class="dotted-line" style="flex:0; width:120px;"></div></div>
                                </div>
                            </div>
                            <div class="header-footer">
                                <span>ਸਮਾਂ: 3 ਘੰਟੇ</span>
                                <span>ਕੁੱਲ ਅੰਕ: ${marks}</span>
                                <span style="border-left:2px solid #000; padding-left:10px;">ਪ੍ਰਾਪਤ ਅੰਕ: _______</span>
                            </div>
                        </div>
                        <div style="text-align:center; font-weight:900; font-size:20px; text-decoration:underline; margin-bottom:20px;">${exam} (2025-26)</div>
                        <div class="paper-body">${htmlContent}</div>
                        <div style="margin-top:40px; text-align:center; font-weight:bold; font-size:12px; border-top:1px dashed #ccc; padding-top:10px;">* ਸੁੰਦਰ ਲਿਖਾਈ ਦੇ 5 ਅੰਕ ਵੱਖਰੇ ਹਨ *</div>
                    </div>
                `;
                switchView(4);
            } catch (e) {
                alert("ਪੇਪਰ ਬਣਾਉਣ ਵਿੱਚ ਸਮੱਸਿਆ ਆਈ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।");
                switchView(2);
            }
        }
    </script>
</body>
</html>
