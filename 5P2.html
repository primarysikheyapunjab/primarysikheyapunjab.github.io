<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ਪੰਜਾਬੀ ਪੇਪਰ ਜਨਰੇਟਰ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans Gurmukhi', sans-serif;
            background-color: #f3f4f6;
        }
        .paper-container {
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800">ਸਕੂਲ ਪ੍ਰੀਖਿਆ ਪੇਪਰ ਜਨਰੇਟਰ</h1>
            <p class="text-gray-600 mt-2">ਕਲਾਸ ਅਤੇ ਵਿਸ਼ਾ ਚੁਣੋ</p>
        </header>

        <!-- Selection Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-6 rounded-lg shadow-sm">
            <div>
                <label class="block text-sm font-medium text-gray-700">ਕਲਾਸ ਚੁਣੋ</label>
                <select id="classSelect" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- ਕਲਾਸ ਚੁਣੋ --</option>
                    <option value="1">ਪਹਿਲੀ (1st)</option>
                    <option value="2">ਦੂਜੀ (2nd)</option>
                    <option value="3">ਤੀਜੀ (3rd)</option>
                    <option value="4">ਚੌਥੀ (4th)</option>
                    <option value="5">ਪੰਜਵੀਂ (5th)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ਵਿਸ਼ਾ ਚੁਣੋ</label>
                <select id="subjectSelect" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- ਵਿਸ਼ਾ ਚੁਣੋ --</option>
                    <option value="P">ਪੰਜਾਬੀ (Punjabi)</option>
                    <option value="M">ਗਣਿਤ (Maths)</option>
                    <option value="E">ਅੰਗਰੇਜ਼ੀ (English)</option>
                    <option value="EV">ਵਾਤਾਵਰਣ (EVS)</option>
                </select>
            </div>
            <div class="md:col-span-2 text-center mt-4">
                <button onclick="generatePaper()" class="bg-blue-600 text-white px-8 py-2 rounded-full font-bold hover:bg-blue-700 transition duration-300 shadow-md">
                    ਪੇਪਰ ਦੇਖੋ
                </button>
            </div>
        </div>

        <!-- Paper Display Area -->
        <div id="paperDisplay" class="hidden paper-container">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="paperTitle" class="text-xl font-bold text-gray-800">ਪੇਪਰ ਪ੍ਰੀਵਿਊ</h2>
                <button onclick="downloadPDF()" class="bg-green-600 text-white px-4 py-1 rounded text-sm hover:bg-green-700">
                    ਡਾਊਨਲੋਡ ਕਰੋ
                </button>
            </div>
            
            <!-- PDF Viewer -->
            <div id="viewerContainer" class="w-full h-[600px] bg-gray-200 rounded flex items-center justify-center relative">
                <p id="loadingText" class="absolute text-gray-500">ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...</p>
                <iframe id="pdfFrame" class="w-full h-full rounded border-0" src=""></iframe>
            </div>

            <div id="errorMessage" class="hidden mt-4 p-4 bg-red-100 text-red-700 rounded border border-red-200">
                ਮਾਫ਼ ਕਰਨਾ! ਇਹ ਪੇਪਰ ਫਾਈਲ ਅਜੇ ਸਰਵਰ 'ਤੇ ਮੌਜੂਦ ਨਹੀਂ ਹੈ ਜਾਂ ਅਪਲੋਡ ਹੋ ਰਹੀ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਯਕੀਨੀ ਬਣਾਓ ਕਿ ਫਾਈਲ ਦਾ ਨਾਮ ਸਹੀ ਹੈ।
            </div>
        </div>
    </div>

    <script>
        let currentFileUrl = "";

        function generatePaper() {
            const classVal = document.getElementById('classSelect').value;
            const subjectVal = document.getElementById('subjectSelect').value;
            const display = document.getElementById('paperDisplay');
            const pdfFrame = document.getElementById('pdfFrame');
            const errorMsg = document.getElementById('errorMessage');
            const loadingText = document.getElementById('loadingText');

            if (!classVal || !subjectVal) {
                alert("ਕਿਰਪਾ ਕਰਕੇ ਕਲਾਸ ਅਤੇ ਵਿਸ਼ਾ ਦੋਵੇਂ ਚੁਣੋ।");
                return;
            }

            // ਫਾਈਲ ਦਾ ਨਾਮ ਬਣਾਉਣਾ (ਜਿਵੇਂ: 1P.pdf)
            // ਕਿਉਂਕਿ ਫਾਈਲਾਂ index.html ਦੇ ਨਾਲ ਹੀ ਹਨ, ਅਸੀਂ ਸਿੱਧਾ ਨਾਮ ਲਿਖਾਂਗੇ
            const fileName = classVal + subjectVal + ".pdf";
            currentFileUrl = fileName; 

            // UI ਅੱਪਡੇਟ ਕਰਨਾ
            display.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            loadingText.style.display = 'block';
            
            // iframe ਵਿੱਚ PDF ਲੋਡ ਕਰਨਾ
            pdfFrame.src = currentFileUrl;

            // ਇਹ ਚੈੱਕ ਕਰਨ ਲਈ ਕਿ ਫਾਈਲ ਮੌਜੂਦ ਹੈ ਜਾਂ ਨਹੀਂ
            fetch(currentFileUrl, { method: 'HEAD' })
                .then(res => {
                    if (!res.ok) {
                        errorMsg.classList.remove('hidden');
                        pdfFrame.classList.add('hidden');
                        loadingText.style.display = 'none';
                    } else {
                        pdfFrame.classList.remove('hidden');
                        loadingText.style.display = 'none';
                    }
                })
                .catch(err => {
                    console.error("Error fetching PDF:", err);
                    errorMsg.classList.remove('hidden');
                });
            
            // ਟਾਈਟਲ ਅੱਪਡੇਟ ਕਰਨਾ
            const subjects = { 'P': 'ਪੰਜਾਬੀ', 'M': 'ਗਣਿਤ', 'E': 'ਅੰਗਰੇਜ਼ੀ', 'EV': 'ਵਾਤਾਵਰਣ' };
            document.getElementById('paperTitle').innerText = `ਕਲਾਸ ${classVal} - ਵਿਸ਼ਾ: ${subjects[subjectVal]}`;
        }

        function downloadPDF() {
            if (currentFileUrl) {
                const link = document.createElement('a');
                link.href = currentFileUrl;
                link.download = currentFileUrl;
                link.click();
            }
        }
    </script>
</body>
</html>
