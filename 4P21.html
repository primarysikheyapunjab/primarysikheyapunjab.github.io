        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active', 'bg-gradient-to-bottom', 'from-blue-500', 'to-blue-700', 'text-white');
                el.classList.add('bg-gradient-to-b', 'from-white', 'to-gray-100', 'text-gray-800');
                el.style.setProperty('--shadow-color', '#94a3b8');
            });

            document.getElementById('content-' + tabId).classList.add('active');
            
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.remove('bg-gradient-to-b', 'from-white', 'to-gray-100', 'text-gray-800');
            activeBtn.classList.add('active');
        }

        // Dictation Logic: Typewriter Effect + Text-to-Speech
        function playDictation(elementId, text) {
            const el = document.getElementById(elementId);
            el.innerHTML = '';
            el.classList.add('typing-cursor');
            
            // Try to speak the text using SpeechSynthesis API (if supported)
            if ('speechSynthesis' in window) {
                let msg = new SpeechSynthesisUtterance();
                msg.text = text;
                msg.lang = 'pa-IN'; // Punjabi language code
                msg.rate = 0.8; // Speak slowly for dictation
                window.speechSynthesis.speak(msg);
            }

            // Typewriter effect
            let i = 0;
            let interval = setInterval(() => {
                if(i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(interval);
                    el.classList.remove('typing-cursor');
                }
            }, 100); // 100ms delay per character
        }

        function renderMCQ() {
            const container = document.getElementById('content-mcq');
            if (!lessonData.mcq || lessonData.mcq.length === 0) return;

            let html = '<h3 class="text-lg md:text-xl font-black text-green-800 border-b-2 border-green-200 pb-2 mb-4"><i class="fa-solid fa-list-check mr-2"></i>ਸਹੀ ਉੱਤਰ ਚੁਣੋ</h3>';
            
            lessonData.mcq.forEach((mcq, qIndex) => {
                html += `
                <div class="bg-green-50 rounded-xl p-4 md:p-5 mb-4 border border-green-100 shadow-sm" id="mcq-box-${qIndex}">
                    <p class="font-black text-gray-900 mb-3 text-base md:text-lg">${qIndex + 1}. ${mcq.question}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">`;
                
                mcq.options.forEach((opt, optIndex) => {
                    const isCorrect = optIndex === mcq.correct_index;
                    html += `<div onclick="checkAnswer(${qIndex}, ${isCorrect}, this)" class="mcq-option bg-white border-2 border-gray-200 rounded-lg p-3 font-bold text-sm md:text-base text-gray-700 flex justify-between items-center">
                        <span>${opt}</span>
                    </div>`;
                });
                
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function checkAnswer(qIndex, isCorrect, element) {
            const parentBox = document.getElementById(`mcq-box-${qIndex}`);
            const options = parentBox.querySelectorAll('.mcq-option');
            
            // Disable further clicks for this question
            options.forEach(opt => {
                opt.onclick = null;
                opt.classList.remove('hover:bg-e0f2fe', 'cursor-pointer');
            });

            if (isCorrect) {
                element.classList.add('correct');
                element.innerHTML += '<i class="fa-solid fa-circle-check text-xl"></i>';
            } else {
                element.classList.add('wrong');
                element.innerHTML += '<i class="fa-solid fa-circle-xmark text-xl"></i>';
                
                // Highlight the correct answer
                const correctIndex = lessonData.mcq[qIndex].correct_index;
                const correctElement = options[correctIndex];
                correctElement.classList.add('correct');
                correctElement.innerHTML += '<i class="fa-solid fa-circle-check text-xl"></i>';
            }
        }
